<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAITH: The Echoes of Alexandria</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e7e2ea;--pn:#f4f0f6;--tx:#2b1620;--mu:#6b5560;--ac:#7c1d33;--ln:#c4b6c9;--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150b10;--pn:#22121a;--tx:#efe6d6;--mu:#a8979a;--ac:#e0b458;--ln:#47293a;--bt:#150b10}}
:root[data-theme="dark"]{--bg:#150b10;--pn:#22121a;--tx:#efe6d6;--mu:#a8979a;--ac:#e0b458;--ln:#47293a;--bt:#150b10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:19px/1.65 Spectral,Georgia,serif;background-image:radial-gradient(ellipse at 50% 0,var(--pn),transparent 70%)}
main{max-width:680px;margin:0 auto;padding:18px 18px 60px}
h1{font:700 clamp(46px,12vw,72px)/1 UnifrakturCook,"Old English Text MT",Georgia,serif;margin:6px 0 0;color:var(--ac);letter-spacing:.02em}
.sub{display:block;font-style:italic;color:var(--mu);margin-bottom:12px}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:16px;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:3px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#hud{margin:12px 0;color:var(--mu);font-size:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--ln);padding-bottom:8px}
.ch{font:700 26px/1.2 UnifrakturCook,Georgia,serif;color:var(--ac);margin:20px 0 10px}
#sc p{margin:0 0 14px;max-width:62ch}
.opts{display:grid;gap:10px;margin-top:22px}
.opts button{text-align:left;padding:12px 14px;border-left:3px solid var(--ac)}
.opts button.go{background:var(--ac);color:var(--bt);border-color:var(--ac)}
.nw{border:1px solid var(--ac);background:var(--pn);padding:12px 14px;margin:16px 0;border-radius:3px}
.nw b{display:block;color:var(--ac)}
.note{background:var(--pn);border:1px solid var(--ln);padding:14px;margin:12px 0;border-radius:3px}
.note h3{margin:0 0 6px;font-size:20px;color:var(--ac)}.note p{margin:0 0 10px}
.dead{color:var(--ac)}.tts{color:var(--mu);font-size:15px}
.end{font:700 34px/1.15 UnifrakturCook,Georgia,serif;color:var(--ac);margin:18px 0 10px}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#fl.on{animation:fl .9s ease-out}
@keyframes fl{0%{opacity:.95}15%{opacity:.1}30%{opacity:.8}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#fl.on{animation:none}}
</style></head>
<body><div id="fl"></div>
<main>
<h1>FAITH</h1><span class="sub">The Echoes of Alexandria</span>
<nav><button id="bn">📜 Note (<span id="cn">0</span>)</button><button id="bv">🔇 Narator: oprit</button><button id="bt">☾ Temă</button></nav>
<div id="hud"></div>
<section id="sc"></section>
<section id="nt" hidden></section>
</main>
<script>
let s,view='g',narr=false;
const $=i=>document.getElementById(i);
const F=n=>{s.f=Math.max(0,Math.min(5,s.f+n))};
const init=()=>{s={f:3,d:0,gun:0,alone:0,janel:0,km:0,kill:0,notes:[],cur:'intro'}};
const N={
jurnal:["Jurnalul starețului","Am luat banii de la oamenii care mi-au dat tot ce aveau. Ritualul cere încă un cerc. Cei din Alexandria promit că ușa se va deschide, iar eu voi sta lângă ea. Dumnezeu tace. Poate că nu mai ascultă."],
potir:["Potirul lui Janel","Potirul sfințit nu suportă sânge. Cine ridică arma împotriva unui om, chiar și din frică, nu mai poate închide ușa Alexandriei. Păstrează credința curată, părinte."],
plan:["Însemnările cultiștilor","Catalistul este aproape gata. Când clopotul va suna a treia oară, ușa din Alexandria se deschide și lumea cade. Nimeni nu trebuie să afle cine păzește clopotnița."],
emilian:["Povestea lui Emilian","Emilian mi-a spus: „Pe vremuri, un om a numărat treptele clopotniței din Alexandria și a scris numele lui sub clopot. Matei S. A rămas acolo. Doar cine merge singur poate ajunge la el.”],
adevar:["Adevărul lui Matei S.","Ce-au ridicat oamenii în Alexandria nu a fost un altar al demonilor, ci un zăvor. Divinitatea nu a tăcut: a păzit. Demonii sunt ecoul fricii noastre, iar ușa se deschide doar celui care o crede goală."]
};
const E={
saint:["Finalul Bun — The Saint Ending","Potirul lui Janel ține ușa închisă. Alături de Mr. Gheorghe, rostești ultima rugăciune, iar clopotul Alexandriei tace pentru totdeauna. Satul se trezește la lumină. Nu ai murit niciodată, nu ai ridicat arma și ai ales credința. Denis Dinu devine un adevărat stâlp al bisericii."],
ev1:["Finalul Rău 1 — Căderea în Păcat","Împușcătura răsună. Mr. Gheorghe se prăbușește, iar credința ta se stinge odată cu el. Rătăcit și corupt, te alături cultului din Alexandria. La al treilea sunet al clopotului, tu ești sacrificiul final al ritualului lor."],
ev2:["Finalul Rău 2 — Blestemul Copilului","Mr. Gheorghe te-a iertat și te-a ridicat. Ajungi aproape de victorie. Dar copilul celui pe care l-ai ucis a rostit un blestem, iar el te găsește chiar în pragul Alexandriei. Mori brusc, cu sutana plină de cenușă, înainte să se termine totul."],
secret:["Finalul Secret — The Lone Crusader","Singur, ai urcat la Matei S. și ai aflat adevărul: ușa nu trebuie închisă cu forța, ci păzită. Rămâi în clopotniță în locul lui, ecou între ecouri. Ai deschis o concluzie pe care nimeni din sat n-o va înțelege."],
bit:["Finalul Amar","Alexandria este salvată, dar nu fără cicatrici. Ai murit de prea multe ori, ai pierdut ceva din credință sau n-ai găsit ajutorul ascuns. Ușa se închide, dar nu complet. Ecourile rămân."]
};
const dead=(t,b)=>({dead:1,back:b,t:[t]});
const Q={
intro:{t:["Un joc de poveste și alegeri. Credința ta, morțile tale și arma pe care o vei lua decid cum se termină totul. Sunt patru finaluri adevărate.","Notele pe care le găsești pot fi ascultate cu voce tare (buton Citește în secțiunea Note). Poți porni și Naratorul din meniu."],o:[{l:"Începe misiunea",g:'start',c:1}]},
start:{c:"Capitolul 1 — Prima Misiune și Timpul Întors",t:["Ai absolvit școala de preoți. Prima ta misiune: o biserică părăsită și izolată, la marginea ținutului Alexandria.","Ești părintele Denis Dinu, idealist și neexperimentat. Ai sutana neagră, o cruce de lemn și o lanternă. Lângă tine, părintele Gheorghe, sever și devotat, cu crucea de aur, candela și o Biblie veche."],o:[{l:"Intră în biserică",g:'c1b'},{l:"Roagă-te înainte să intri (+1 credință)",g:'c1b',d:()=>F(1)}]},
c1b:{fx:1,t:["Pașii tăi răsună în nava goală. BOOM! Un fulger lovește afară, iar realitatea se frânge.","Biserica se întoarce în vremea ei: lumânări aprinse, bănci pline. Enoriașii sunt fantome, blocate în ciclul morții."],o:[{l:"Vorbește cu fantomele",g:'c1g'},{l:"Atinge candelabrul care plutește",g:'d1'}]},
d1:dead("Candelabrul spectral te înghite într-un foc rece. Mori.",'c1b'),
c1g:{t:["Fantomele șoptesc despre un stareț care le-a luat banii. Una dintre ele, un bărbat cu ochi goi, te privește dușmănos.","Nu vrea să vorbească."],o:[{l:"Scoate crucea în fața fantomei ostile",g:'c1w'}]},
c1w:{t:["Fantoma refuză să răspundă. Se înfurie, te ia pe sus și te aruncă printr-un perete."],o:[{l:"Ridică-te din moloz",g:'c1x'}]},
c1x:{n:'jurnal',t:["Dincolo de perete descoperi dovezi șocante: lada starețului, cărți de socoteli, cercuri desenate cu sânge. Starețul fura banii enoriașilor și practica ritualuri oculte.","Misterul fantomei este rezolvat. Prima biserică se liniștește. Tencuiala de lângă altar este totuși crăpată, iar când o atingi sună a gol."],o:[{l:"Ciocănește în peretele fals",g:'jan'},{l:"Încheie capitolul",g:'c2a'}]},
jan:{n:'potir',e:()=>{s.janel=1},t:["În spatele peretelui, un bătrân se ghemuiește lângă un potir sfințit. „Eu sunt Janel. Nu m-a găsit nimeni în o sută de ani. Ia potirul, părinte. Fără el nu vei închide Alexandria.”"],o:[{l:"Încheie capitolul",g:'c2a'}]},
c2a:{c:"Capitolul 2 — Dispariția lui Mr. Gheorghe",t:["Părintele Gheorghe scoate apă la fântâna veche din sat. Brusc, o forță nevăzută din adâncuri îl trage în interior.","Ești singur. Cultiști cu felinare se apropie dintre case."],o:[{l:"Fugi pe drumul principal",g:'d2'},{l:"Ocolește prin livadă",g:'c2b'}]},
d2:dead("Cultiștii te prind în drum. Mori.",'c2a'),
c2b:{n:'plan',t:["În livadă dai peste Emilian Pancu și Damian, doi supraviețuitori. Emilian îți povestește istoria întunecată a cultului.","La un cultist căzut găsești însemnări: cineva pregătește un catalist care să distrugă lumea. Centrul planului este regiunea Alexandria."],o:[{l:"Ascultă povestea lui Emilian până la capăt",g:'c2c',d:()=>{s.km=1;add('emilian')}},{l:"Pleacă repede",g:'c2c'}]},
c2c:{t:["La marginea satului te oprește Serban, fost cântăreț bisericesc care a trădat comunitatea. Îți arată un pistol vechi, învelit în pânză.","„Se plătește, părinte. Spune-i lui Emilian că eu n-am trădat pe nimeni.”"],o:[{l:"Ia arma și minte pentru el (−2 credință)",g:'c3a',d:()=>{s.gun=1;F(-2)}},{l:"Refuză arma și minciuna",g:'c3a'}]},
c3a:{c:"Capitolul 3 — Alianța și Răspântia",t:["Mr. Gheorghe iese miraculos din fântână, ud și epuizat. Alergi spre el, vorbiți scurt, vă bateți palma și reînnoiți legământul sacru."],o:[{l:"Pornește la vânătoarea demonului",g:'c3m'}]},
c3m:{t:["Urmele demonului duc într-o ceață deasă. Ceva se mișcă. O siluetă."],o:[{l:"Strigă: „Cine e acolo?”",g:'c3d'},{l:"Trage în siluetă",g:'c3k',i:()=>s.gun}]},
c3k:{e:()=>{s.kill=1},t:["Împușcătura sună ca un clopot spart. Silueta cade: era Damian, rătăcit în ceață. Gheorghe te ridică fără reproș: „Dumnezeu iartă, fiule. Hai.”","Dar în depărtare auzi plânsul unui copil."],o:[{l:"Mergi mai departe",g:'c3e'}]},
c3d:{t:["Este Damian, tremurând. Îți arată pe unde a trecut demonul și se ascunde."],o:[{l:"Mergi mai departe",g:'c3e'}]},
c3e:{t:["Demonul major se ridică din ceață și intră în Mr. Gheorghe. Vocea lui devine a altcuiva. Cu mâini tremurânde, el deschide Biblia de piele, pentru prima oară, iar realitatea se rupe."],o:[{l:"Recită psalmul alături de el (+1 credință)",g:'c3s',d:()=>F(1)},{l:"Trage în mentorul tău",g:'ev1',i:()=>s.gun},{l:"Rămâi înmărmurit",g:'d3'}]},
d3:dead("Demonul te lovește cu o mână de umbră. Mori.",'c3e'),
c3s:{t:["Psalmul risipește demonul. Gheorghe se clatină, apoi spune: „Aici drumul se desparte. Vii cu mine spre Alexandria sau mergi singur?”"],o:[{l:"Rămâi alături de Mr. Gheorghe",g:'fin'},{l:"Despărțiți-vă: mergi singur",g:'solo',d:()=>{s.alone=1}}]},
solo:{t:["Gheorghe te binecuvântează și dispare în ceață. Alexandria se ridică în fața ta: turnuri negre, un clopot care bate fără nimeni."],o:[{l:"Urcă în clopotniță, unde se pomenește un nume",g:'matei',i:()=>s.km},{l:"Intră în sala ritualului",g:'d4'}]},
d4:dead("Ceva te chema din clopotniță, dar tu n-ai știut cine. Cultul te găsește în sala ritualului. Mori.",'solo'),
matei:{n:'adevar',t:["În clopotniță, un om scrijelește un nume pe perete: Matei S. El îți spune un adevăr despre divinitate și despre entitățile din Alexandria. Totul se schimbă."],o:[{l:"Primește adevărul",g:'fin'}]},
fin:{r:()=>s.kill?'ev2':s.alone?'secret':(s.d==0&&s.janel&&s.f>=4?'saint':'bit')},
saint:{end:'saint'},ev1:{end:'ev1'},ev2:{end:'ev2'},secret:{end:'secret'},bit:{end:'bit'}
};
function add(k){if(!s.notes.includes(k)){s.notes.push(k);return 1}}
function go(id){
 const q=Q[id];if(q.r)return go(q.r());
 s.cur=id;if(q.dead)s.d++;if(q.e)q.e();
 q.nn=q.n&&add(q.n)?q.n:null;
 if(q.end)unlock(q.end);
 view='g';if(q.fx){const f=$('fl');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
 draw();
}
function unlock(k){try{const a=JSON.parse(localStorage.getItem('faithEnd')||'[]');if(!a.includes(k)){a.push(k);localStorage.setItem('faithEnd',JSON.stringify(a))}}catch(e){}}
function got(){try{return JSON.parse(localStorage.getItem('faithEnd')||'[]')}catch(e){return[]}}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function draw(){
 const q=Q[s.cur],S=$('sc'),T=$('nt');S.replaceChildren();
 $('cn').textContent=s.notes.length;
 $('hud').textContent='';
 $('hud').append(el('span','','Credință: '+'✝'.repeat(s.f)+'·'.repeat(5-s.f)),el('span','','Morți: '+s.d));
 S.hidden=view!='g';T.hidden=view!='n';
 if(view=='n')return notes();
 let txt=[];
 if(q.end){const e=E[q.end];S.append(el('div','end',e[0]),el('p','',e[1]));txt=[e[0],e[1]];
  const g=got().filter(k=>k!='bit').length;S.append(el('p','tts','Finaluri descoperite: '+g+' din 4.'));
  const b=el('button','go','Joacă din nou');b.onclick=()=>{init();go('intro')};S.append(el('div','opts'));S.lastChild.append(b);
 }else{
  if(q.c)S.append(el('div','ch',q.c));
  if(q.dead)S.append(el('p','dead','Ai murit.'));
  q.t.forEach(p=>{S.append(el('p','',p));txt.push(p)});
  if(q.nn){const n=el('div','nw'),h=el('b','','Notă nouă: '+N[q.nn][0]);n.append(h,rb(q.nn));S.append(n)}
  const o=el('div','opts');
  if(q.dead){const b=el('button','go','Încearcă din nou');b.onclick=()=>go(q.back);o.append(b)}
  (q.o||[]).forEach(x=>{if(x.i&&!x.i())return;const b=el('button',x.c?'go':'',x.l);b.onclick=()=>{if(x.d)x.d();go(x.g)};o.append(b)});
  S.append(o);
 }
 scrollTo(0,0);
 if(narr)say(txt.join(' '));
}
function notes(){
 const T=$('nt');T.replaceChildren(el('div','ch','Note găsite'));
 if(!s.notes.length)T.append(el('p','tts','Nu ai găsit nicio notă încă.'));
 s.notes.forEach(k=>{const n=el('div','note');n.append(el('h3','',N[k][0]),el('p','',N[k][1]),rb(k));T.append(n)});
 const b=el('button','go','Înapoi la joc');b.onclick=()=>{stop();view='g';draw()};T.append(b);
 T.append(el('p','tts',V?'Voce: '+V.name:'Nu am găsit voce românească; se folosește vocea implicită a browserului.'));
}
function rb(k){const d=el('div');d.style.cssText='display:flex;gap:8px';
 const a=el('button','','🔊 Citește'),b=el('button','','■ Stop');
 a.onclick=()=>say(N[k][0]+'. '+N[k][1]);b.onclick=stop;d.append(a,b);return d}
const syn=window.speechSynthesis;let V=null;
function vs(){V=(syn.getVoices()||[]).find(v=>/^ro/i.test(v.lang))||null}
if(syn){vs();syn.onvoiceschanged=vs}
function say(x){if(!syn)return;syn.cancel();const u=new SpeechSynthesisUtterance(x);u.lang='ro-RO';if(V)u.voice=V;u.rate=.92;syn.speak(u)}
function stop(){if(syn)syn.cancel()}
$('bn').onclick=()=>{view=view=='n'?'g':'n';stop();draw()};
$('bv').onclick=()=>{narr=!narr;$('bv').textContent=(narr?'🔊 Narator: pornit':'🔇 Narator: oprit');if(narr){const q=Q[s.cur];say((q.t||[]).join(' '))}else stop()};
$('bt').onclick=()=>{const r=document.documentElement,d=matchMedia('(prefers-color-scheme: dark)').matches;const cur=r.dataset.theme||(d?'dark':'light');r.dataset.theme=cur=='dark'?'light':'dark'};
init();go('intro');
</script></body></html>
